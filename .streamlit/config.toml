# Diamond Sports Lab — Streamlit theme
[theme]
primaryColor = "#1a2150"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f7fb"
textColor = "#1f2937"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false

[server]
# headless = true tells Streamlit "no terminal, no browser pop-up" —
# REQUIRED on Streamlit Cloud, otherwise the boot hangs on the
# "Welcome to Streamlit / Email:" prompt waiting for user input that
# can never come. For local use, start.command auto-opens the browser
# anyway, so this doesn't hurt the local experience.
headless = true
runOnSave = true
# Allow larger video uploads for Live Capture beta testing.
maxUploadSize = 200

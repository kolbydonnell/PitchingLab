# Diamond Sports Lab — DARK theme (night mode)
[theme]
base = "dark"
primaryColor          = "#3b82f6"   # bright blue — primary actions, tab accent
backgroundColor       = "#0f172a"   # slate-900, deep navy page background
secondaryBackgroundColor = "#1e293b"  # slate-800, lifted cards/sidebar
textColor             = "#e2e8f0"   # slate-200, body text
font                  = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false

[server]
# headless = true REQUIRED on Streamlit Cloud — skips email onboarding hang.
headless = true
runOnSave = true
maxUploadSize = 200
